<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#01030d" />
    </radialGradient>
    <linearGradient id="neonCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />

  <!-- Outer Neon Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#neonCyanPink)" stroke-width="6" filter="url(#glow)" opacity="0.8" />

  <!-- Gamepad Console Outline -->
  <g transform="translate(256, 256)">
    <!-- Controller Body -->
    <path d="M -150,-40 C -150,-90 -90,-100 0,-100 C 90,-100 150,-90 150,-40 C 150,40 180,110 130,120 C 80,130 50,40 0,40 C -50,40 -80,130 -130,120 C -180,110 -150,40 -150,-40 Z" fill="#0f172a" stroke="#06b6d4" stroke-width="8" filter="url(#glow)" />

    <!-- D-Pad Left -->
    <path d="M -95,-45 h 30 v -30 h 30 v 30 h 30 v 30 h -30 v 30 h -30 v -30 h -30 Z" transform="translate(-20, 10)" fill="#06b6d4" />

    <!-- Action Buttons Right -->
    <circle cx="85" cy="-25" r="14" fill="#f43f5e" filter="url(#glow)" />
    <circle cx="115" cy="5" r="14" fill="#10b981" filter="url(#glow)" />
    <circle cx="85" cy="35" r="14" fill="#f59e0b" filter="url(#glow)" />
    <circle cx="55" cy="5" r="14" fill="#06b6d4" filter="url(#glow)" />

    <!-- Center Cyber Arcade Crown/Star -->
    <polygon points="0,-45 12,-15 42,-15 18,5 28,35 0,15 -28,35 -18,5 -42,-15 -12,-15" fill="#f59e0b" filter="url(#glow)" />
  </g>
</svg>
